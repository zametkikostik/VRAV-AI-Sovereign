codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 40%

comment:
  layout: "reach,diff,flags,files"
  behavior: default

ignore:
  - "tests/**"
  - "scripts/**"
  - "evals/**"
  - "web/**"
