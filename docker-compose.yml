version: "3.9"
services:
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    restart: unless-stopped
  vrav-api:
    build: .
    ports: ["8000:8000"]
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AUTH_MODE=${AUTH_MODE:-off}
    volumes: ["./logs:/app/logs"]
    depends_on: [ollama]
    restart: unless-stopped
volumes:
  ollama_data:
