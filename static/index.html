<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VRAV AI</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">🛡️</span>
        <div>
          <strong>VRAV AI</strong>
          <small>Sovereign Agent</small>
        </div>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-panel="chat">Chat</button>
        <button class="nav-btn" data-panel="sessions">Sessions</button>
        <button class="nav-btn" data-panel="skills">Skills / RAG</button>
        <button class="nav-btn" data-panel="sandbox">Sandbox</button>
      </nav>
      <div class="sidebar-section api-key-box">
        <label>API Key</label>
        <input id="apiKeyInput" type="password" placeholder="vrav_… (optional)" />
      </div>
      <div class="sidebar-section">
        <button type="button" id="themeToggle" class="theme-toggle">Theme: dark</button>
      </div>
      <div class="sidebar-section">
        <label>Mode</label>
        <select id="modeSelect">
          <option value="agent">Agent + tools (SSE)</option>
          <option value="stream">Simple stream</option>
          <option value="delegate">Multi-agent</option>
        </select>
      </div>
      <div class="sidebar-section">
        <label>Model (optional)</label>
        <input id="modelInput" placeholder="llama3.1 / bggpt" />
      </div>
      <div class="sidebar-foot">
        <button id="newChatBtn" class="primary">+ New chat</button>
        <a href="/docs" target="_blank" class="link">API docs</a>
      </div>
    </aside>
    <main class="main">
      <section id="panel-chat" class="panel active">
        <header class="topbar">
          <h1>Chat</h1>
          <div class="status" id="connStatus">ready</div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="chatForm" class="composer">
          <textarea id="promptInput" rows="2" placeholder="Питай VRAV…"></textarea>
          <button type="submit" id="sendBtn">Send</button>
        </form>
      </section>
      <section id="panel-sessions" class="panel">
        <header class="topbar">
          <h1>Multi-agent sessions</h1>
          <button id="refreshSessions" class="ghost">Refresh</button>
        </header>
        <div class="split">
          <div class="list" id="sessionList"></div>
          <div class="detail" id="sessionDetail"><p class="muted">Select a session</p></div>
        </div>
        <form id="sessionStartForm" class="composer">
          <textarea id="sessionPrompt" rows="2" placeholder="Start session…"></textarea>
          <button type="submit">Start session</button>
        </form>
      </section>
      <section id="panel-skills" class="panel">
        <header class="topbar">
          <h1>Skills & RAG</h1>
          <button id="reindexBtn" class="ghost">Reindex vectors</button>
        </header>
        <div class="toolbar">
          <input id="ragQuery" placeholder="Semantic search skills…" />
          <button id="ragSearchBtn">Search</button>
        </div>
        <div id="skillsOut" class="cards"></div>
      </section>
      <section id="panel-sandbox" class="panel">
        <header class="topbar">
          <h1>Code sandbox</h1>
          <div class="quota" id="quotaInfo">quota: —</div>
        </header>
        <p class="muted">Whitelist only. No network / FS / subprocess.</p>
        <textarea id="sandboxCode" rows="12" class="code">import math\nprint(math.sqrt(16))</textarea>
        <div class="toolbar">
          <label class="check"><input type="checkbox" id="dockerMode" /> Docker</label>
          <input id="userId" value="default" />
          <button id="runSandboxBtn" class="primary">Run</button>
        </div>
        <pre id="sandboxOut" class="code-out"></pre>
      </section>
    </main>
  </div>
  <script src="/static/js/app.js"></script>
</body>
</html>
