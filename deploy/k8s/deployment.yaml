apiVersion: v1
kind: Namespace
metadata:
  name: vrav
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vrav-api
  namespace: vrav
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vrav-api
  template:
    metadata:
      labels:
        app: vrav-api
    spec:
      containers:
        - name: api
          image: ghcr.io/zametkikostik/vrav-ai:0.8.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: vrav-api
  namespace: vrav
spec:
  selector:
    app: vrav-api
  ports:
    - port: 80
      targetPort: 8000
