upstream vrav_upstream { server 127.0.0.1:8000; keepalive 32; }
server {
    listen 80;
    server_name vrav.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name vrav.example.com;
    ssl_certificate     /etc/letsencrypt/live/vrav.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrav.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    location / {
        proxy_pass http://vrav_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/stream/sse {
        proxy_pass http://vrav_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/agent/sse {
        proxy_pass http://vrav_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
    }
}
