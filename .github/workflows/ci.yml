name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx
      - name: Offline tests + coverage
        run: |
          pytest tests/ -q \
            --ignore=tests/test_e2e_ollama.py \
            --ignore=tests/test_eurlex.py \
            --ignore=tests/test_cellar.py \
            --cov=core --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=25
        env:
          AUTH_MODE: off
      - name: Upload coverage xml (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: vrav-core
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: AST syntax check
        run: |
          python - <<'PY'
          import ast, sys
          from pathlib import Path
          bad = []
          for p in Path(".").rglob("*.py"):
              if any(x in p.parts for x in (".venv", "node_modules", ".git")):
                  continue
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("syntax ok")
          PY

  sandbox-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/test_sandbox.py tests/test_quotas.py tests/test_policy.py tests/test_security_suite.py -q
        env:
          AUTH_MODE: off

  e2e-ollama:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || vars.ENABLE_OLLAMA_E2E == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b
      - run: pip install -r requirements.txt pytest pytest-asyncio httpx
      - name: E2E
        env:
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OLLAMA_DEFAULT_MODEL: llama3.2:1b
          VRAV_E2E_MODEL: llama3.2:1b
          AUTH_MODE: off
        run: pytest tests/test_e2e_ollama.py -v --tb=short
